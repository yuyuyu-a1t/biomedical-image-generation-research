paths:
  data_root: data/LUNA16
  processed_dir: data/processed_improved_128
  outputs_dir: outputs/improved_128
  checkpoints_dir: checkpoints/improved_128
  reports_dir: reports

preprocess:
  resolution: 128
  hu_min: -1000.0
  hu_max: 400.0
  non_air_threshold_hu: -900.0
  min_non_air_ratio: 0.35
  lung_hu_low: -1000.0
  lung_hu_high: -400.0
  min_lung_ratio: 0.18
  slice_stride: 3
  split_ratios: [0.8, 0.1, 0.1]
  max_scans: null
  max_slices_per_scan: null

model:
  in_channels: 1
  base_channels: 64
  time_embedding_dim: 256
  dropout: 0.05

diffusion:
  train_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  sampling_method: ddim
  sampling_steps: 50
  ddim_eta: 0.0

train:
  seed: 42
  batch_size: 32
  num_workers: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_steps: 10000
  max_train_slices: null
  mixed_precision: true
  gradient_clip: 1.0
  ema_decay: 0.999
  log_every: 20
  save_every: 1000
  sample_every: 1000
  sample_count: 16
  resume: null

evaluate:
  generated_count: 16
  nearest_neighbor_candidates: 7000
  histogram_bins: 100
